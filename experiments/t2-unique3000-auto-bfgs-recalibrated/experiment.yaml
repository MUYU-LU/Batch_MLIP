  reserved memory from 12.61 to 49.11 GiB, reduces production time from
  395.95 to 311.10 seconds, and preserves the 2,999-of-3,000 convergence
  result. The remaining gap to the 66.15 GiB safety budget is consistent
  with the configured 1.25 growth margin, so no workload-specific memory
  coefficient was changed.
