hypothesis: >-
  Preserving per-device memory-safe resident chunks when enough chunks
  already exist to occupy every GPU reduces unnecessary multi-GPU
  subdivision, increases GPU memory utilization, and improves 3,000-system
  variable-cell AtomBit BFGS throughput without changing convergence.
