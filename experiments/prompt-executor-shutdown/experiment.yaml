id: prompt-executor-shutdown
date: 2026-07-28
baseline_commit: be7d01d7eda957c22d5839ba5046ea01b0e2ee98
hypothesis: >-
  An acknowledged global-deadline shutdown and bounded descriptor-based tensor
  sharing reduce four-GPU BatchExecutor shutdown below two seconds, eliminate
  the post-summary interpreter hang, and preserve full convergence on the
  held-out R256 and R1024 pools without changing compute time or peak memory.
mechanism:
  - Shared-memory event acknowledgment proves every worker consumed its
    shutdown sentinel.
  - One global deadline replaces four sequential 30-second joins.
  - Acknowledged teardown stragglers are terminated concurrently.
  - Descriptor-based tensor sharing avoids detached torch_shm_manager
    processes retaining the parent resource-tracker pipe.
workloads:
  source_experiment: ../heldout-auto-vs-mps
  manifests:
    - ../heldout-auto-vs-mps/workloads/manifests/OPT-HOLDOUT-MIX-R256-v1.json
    - ../heldout-auto-vs-mps/workloads/manifests/OPT-HOLDOUT-MIX-R1024-v1.json
configuration:
  identical_to_source_experiment: true
  gpu_count: 4
  shutdown_timeout_seconds: 2.0
metrics:
  - executor_shutdown_wall_seconds
  - acknowledged_worker_ids
  - forced_worker_count
  - external_process_wall_seconds
  - api_wall_seconds
  - production_wall_seconds
  - convergence
  - final_state_sha256
gates:
  shutdown_wall_seconds_max: 2.0
  external_process_faster_than_mps: true
  convergence_match_before_after: true
  production_time_relative_change_max: 0.02
  peak_reserved_memory_relative_change_max: 0.01
timing_repeats: 1
