id: omc-csp-multigpu-streaming-refill-v1
date: 2026-08-01
hypothesis: >-
  Bounded source-backed compatible refill micro-pools can retain outer work
  stealing and recover the eight-GPU inner-tail benefit without private-queue
  regressions at lower GPU counts.
workload:
  id: OPT-OMC-SCHED-E1-TEST-OBEQIX-P2048-INTRA-NARROW-v2
  split: held_out_test
  pool_size: 2048
  homogeneous_optimizer_shape: true
methods:
  baseline: automatic_active_drain_work_stealing
  secondary_baseline: private_local_compatible_refill
  candidate: bounded_source_backed_streaming_refill
gpu_counts: [2, 4, 8]
configuration:
  model: AtomBit-OMC-s smooth_rms fp32 epoch5
  optimizer: BFGS
  optimizer_dtype: float64
  cell_filter: FrechetCellFilter
  cutoff_A: 6.0
  skin_A: 0.5
  memory_fraction: 0.85
  resident_capacity: 131
  capacity_source: worst_case_memory_safe_first_wave
  micro_pool_count: 8
  micro_pool_size: 256
  resident_waves_per_micro_pool_max: 2
  refill_policy: immediate
  refill_storage: slots
  materialization: manifest_lazy_micro_pool
  outer_assignment: dynamic_work_stealing
  timing_repeats: 1
limitations:
  source_admission_granularity: complete_micro_pool
  live_slot_demand_channel: false
  optimizer_state_migration: false
gates:
  execution_speedup_min: 1.02
  peak_reserved_memory_fraction_max: 0.85
  convergence_count: 2048
  endpoint_energy_difference_meV_per_atom_max: 5.0
status: completed_mixed_not_promoted
decision:
  automatic_default: active_drain
  streaming_compatible_refill: explicit_only
  next_requirement: in_flight_eligibility_and_cross_workload_validation
