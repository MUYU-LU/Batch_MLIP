conclusion: >-
  Supported for this workload. The frozen automatic OMC-CSP workflow is
  2.09x faster than MPS8 and 1.68x faster than the stronger MPS16 production
  baseline while retaining exact source coverage and the same 5,999/6,000
  convergence result. Doubling MPS workers improves production throughput by
  only 1.25x while increasing sampled peak GPU memory by 1.69x.

limitations:
  - One deterministic timing trial, as requested.
  - One T2 workload and one AtomBit checkpoint.
  - BFGS trajectories are schedule-sensitive, so endpoint differences are
    recorded as diagnostics rather than required to be bitwise identical.
  - Phase fractions are summed GPU work, not critical-path wall-time fractions.
