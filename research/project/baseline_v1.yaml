  memory:
    exact_contract_capacity: signed_offline_peak_reserved_bytes_model
    mismatch_fallback: representative_forward
    representative_forward_max_systems: 4
    resident_count_cap: 256
    safety_fraction: 0.85
    optimization_growth_margin: 1.10
    dense_bfgs_state_reserved: true
  optimization:
    active_compaction: true
    optimizer_selection: false
  decision_manifest:
    path: metadata.scheduling.policy_manifest
    application_domain_inference: false
    observed_duration_telemetry: true
    unsupported_action_fallbacks_recorded: true
  single_device_refill:
    selector: exact_evidence_match
    supported_policy_artifact: atombit-smooth-rms-bfgs-h100-refill-v2
    fallback: active_drain
  multi_device:
    refill: false
    refill_reason: no_accepted_multi_gpu_scientific_policy
    target_execution_chunks_per_device: 2
    initial_assignment: bucket_stratified
    pending_assignment: largest_cost_first_work_stealing
    optimizer_state_migration: false
    explicit_experiment_policies:
