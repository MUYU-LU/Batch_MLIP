limitations:
  - Refill evidence is contract-specific rather than a general predictor.
  - Supplied devices are treated as available execution resources; their external opportunity cost is not modeled.
  - Multi-GPU execution may change chunk membership and numerical reduction order.
  - The signed offline capacity policy has sparse strict endpoint-tolerance
    exceptions relative to the probe-backed tensor schedule.
  - Cache skin is not selected automatically.
  - MD uses separate execution paths and is not covered by scheduler v1.
  - Historical timings are not eligible as chemical-transfer training labels.
  - Strict BFGS and ASE BFGS may reach different local minima; schedule-level
    speed comparisons do not claim endpoint identity.
